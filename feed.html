<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HB S — Private Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid #222;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
header h1{font-size:18px;letter-spacing:3px;font-weight:700}
header a{color:#fff;text-decoration:none;font-size:13px;border:1px solid #333;padding:6px 12px;border-radius:20px}
#feed{max-width:470px;margin:0 auto;padding-bottom:80px}
.post{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:3px;margin:12px 0;overflow:hidden}
.post img{width:100%;display:block;max-height:600px;object-fit:contain;background:#111}
.post.info{padding:14px 16px}
.post.caption{white-space:pre-wrap;line-height:1.6;font-size:15px}
.post.date{color:#666;font-size:11px;margin-top:10px;letter-spacing:1px}
.empty{color:#444;text-align:center;margin-top:120px;padding:20px;line-height:1.6}
#adminBtn{position:fixed;bottom:22px;right:22px;background:#fff;color:#000;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 20px rgba(255,255,255,.2)}
#adminPanel{position:fixed;inset:0;background:#000;z-index:100;display:none;padding:20px;overflow:auto}
#adminPanel.show{display:block}
input,textarea{width:100%;background:#111;border:1px solid #222;color:#fff;padding:14px;border-radius:12px;margin-bottom:12px;font-size:15px}
button.main{width:100%;background:#fff;color:#000;border:0;padding:15px;border-radius:12px;font-weight:700;font-size:15px}
</style>
</head>
<body>

<header>
<h1>HB S</h1>
<a href="https://hbswriter.github.io">OFFICIAL SITE</a>
</header>

<div id="feed"></div>
<a id="adminBtn" href="javascript:openAdmin()">+</a>

<div id="adminPanel">
<h2 style="margin-bottom:20px">New Post — Only You</h2>
<input id="pass" type="password" placeholder="Password (default: hbswriter123)">
<input id="file" type="file" accept="image/*">
<textarea id="text" rows="8" placeholder="Paste your writing here...&#10;&#10;Example: Winter is the season where..."></textarea>
<button class="main" onclick="publish()">POST NOW</button>
<button onclick="closeAdmin()" style="width:100%;background:transparent;color:#666;border:0;padding:15px;margin-top:10px">Cancel</button>
<p style="color:#444;font-size:12px;margin-top:20px;text-align:center">Tip: Image is optional. You can post only text like Instagram caption.</p>
</div>

<script>
const PASSWORD = "hbswriter123"; // তুমি চাইলে এটা change করে দাও
let posts = JSON.parse(localStorage.getItem('hbs_feed') || '[]');

function render(){
  const feed = document.getElementById('feed');
  if(posts.length===0){
    feed.innerHTML = `<div class="empty">No posts yet.<br>Click + to create your first post.<br><br>Share link:<br><b>hbswriter.github.io/feed.html</b><br><br>Anyone with link can see.</div>`;
    return;
  }
  feed.innerHTML = posts.slice().reverse().map(p=>`
    <div class="post">
      ${p.img? `<img src="${p.img}">` : ''}
      <div class="info">
        <div class="caption">${escapeHtml(p.text)}</div>
        <div class="date">${p.date}</div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function openAdmin(){ document.getElementById('adminPanel').classList.add('show') }
function closeAdmin(){ document.getElementById('adminPanel').classList.remove('show') }

function publish(){
  if(document.getElementById('pass').value!== PASSWORD){ alert('Wrong password!'); return; }
  const text = document.getElementById('text').value.trim();
  if(!text){ alert('Write something!'); return; }
  const file = document.getElementById('file').files[0];

  const save = (imgData) => {
    posts.push({ text, img: imgData || '', date: new Date().toLocaleString() });
    localStorage.setItem('hbs_feed', JSON.stringify(posts));
    document.getElementById('text').value=''; document.getElementById('file').value='';
    closeAdmin(); render();
  };

  if(file){
    const reader = new FileReader();
    reader.onload = e => save(e.target.result);
    reader.readAsDataURL(file);
  } else {
    save('');
  }
}

render();
</script>
</body>
</html>
